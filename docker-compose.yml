services:
  postgres:
    image: postgres:16-alpine
    container_name: medikiosk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk_secret
      POSTGRES_DB: medikiosk_db
    ports:
      - "5433:5432"
    volumes:
      - medikiosk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medikiosk -d medikiosk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medikiosk_postgres_data:
    driver: local
